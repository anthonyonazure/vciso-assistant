# Seed risk register. This is the company's open-risk inventory the
# vCISO tracks and reports on. In production, risks come from incidents,
# audits, vuln scans, customer questionnaires that exposed gaps, etc.
# Here we seed 10 representative risks across categories.

risks:
  - id: R-001
    title: Storage account allows public blob access
    category: Cloud Configuration
    severity: high
    status: open
    likelihood: medium
    impact: high
    discovered_at: 2026-04-15
    discovered_by: compliance-evidence-agent (run 73dcbc5819)
    owner: cloud-platform-team
    target_close_date: 2026-05-30
    notes: |
      Storage account aamlogs01 has allowBlobPublicAccess=true. Disable
      via az CLI or refactor to require SAS tokens for any public-ish
      access pattern.

